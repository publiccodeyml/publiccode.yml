name: Build Standard

on:
  pull_request:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+-rc"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test documentation version selector
        run: node --test tests/version-switcher.test.cjs
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Test documentation checks
        run: uv run --frozen python -m unittest discover -s tests
      - name: Build Standard with warnings as errors
        run: uv run --frozen sphinx-build -W --keep-going -c . spec/v1 build
      - name: Check specification examples
        run: uv run --frozen scripts/check-examples.py
